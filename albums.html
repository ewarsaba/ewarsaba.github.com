		<script type="text/javascript">
			// Renders the page from albums.json (newest year first; albums in ranked order).
			// Note: fetch() doesn't work from file:// - preview with a local web server.
			function el(tag, attrs, children) {
				var e = document.createElement(tag);
				for (var k in attrs || {}) e.setAttribute(k, attrs[k]);
				(children || []).forEach(function (c) {
					e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
				});
				return e;
			}

			function card(year, a, rank) {
				var img = el('img', { 'class': 'card-img-top img-fluid', src: 'images/' + year + '/' + a.image, alt: a.artist + ' - ' + a.title, loading: 'lazy' });
				var cover = a.link ? el('a', { href: a.link, target: '_blank' }, [img]) : img;
				return el('div', { 'class': 'col-md-4 mb-4' }, [
					el('div', { 'class': 'card shadow-sm h-100' }, [
						cover,
						el('div', { 'class': 'card-body' }, [
							el('h1', {}, ['#' + rank]),
							el('h4', {}, [a.artist]),
							el('h4', {}, [el('small', {}, [a.title])])
						])
					])
				]);
			}

			fetch('albums.json')
				.then(function (r) { return r.json(); })
				.then(function (years) {
					var tabs = document.getElementById('pills-tab');
					var panes = document.getElementById('pills-tabContent');
					years.forEach(function (y, i) {
						var first = i === 0;
						tabs.appendChild(el('li', { 'class': 'nav-item' }, [
							el('a', { 'class': 'nav-link' + (first ? ' active' : ''), id: 'pills-' + y.year + '-tab', 'data-toggle': 'pill',
								href: '#pills-' + y.year, role: 'tab', 'aria-controls': 'pills-' + y.year, 'aria-selected': String(first) }, [String(y.year)])
						]));
						var heading = el('a', y.sheet ? { href: y.sheet, target: '_blank' } : {}, [el('strong', {}, [String(y.year)])]);
						panes.appendChild(el('div', { 'class': 'album py-3 bg-light2 tab-pane fade' + (first ? ' show active' : ''),
							id: 'pills-' + y.year, role: 'tabpanel', 'aria-labelledby': 'pills-' + y.year + '-tab' }, [
							el('div', { 'class': 'container' }, [
								el('h1', { 'class': 'text-center' }, [heading]),
								el('div', { 'class': 'row' }, y.albums.map(function (a, j) { return card(y.year, a, j + 1); }))
							])
						]));
					});

					var newest = years[0].year, oldest = years[years.length - 1].year;
					var year = parseInt(window.location.hash.substring(1)) || newest;
					year = Math.max(oldest, Math.min(newest, year));
					$('#pills-tab a[href="#pills-' + year + '"]').tab('show');
				});
		</script>
